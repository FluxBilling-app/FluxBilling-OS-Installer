# Watchdog for everything this installer fetches at boot time.
#
# The menu pins upstream URLs it does not control. Three things go wrong on
# their own schedule:
#
#   1. A URL disappears. Debian deletes archived suites outright (buster is
#      already 404 on deb.debian.org), and any pinned tag can be pulled.
#   2. A URL silently MOVES: releases.ubuntu.com 301s superseded point
#      releases to httpS old-releases. A curl that follows redirects reports
#      "healthy" exactly when the menu's http-only iPXE fetch starts landing
#      on a different host over a different scheme - so the iPXE-fetched URLs
#      are probed with --max-redirs 0 and every 3xx is reported.
#      (mirror.stream.centos.org already 301s the kernel fetch to https.)
#   3. Content changes underneath a pin. Alma, Rocky and CentOS Stream roll
#      their repos forward continuously, so a signed-and-pinned kernel/initrd
#      drifts out of step with the stage2 that inst.repo now serves.
#
# Without this, the discovery mechanism for all three is a failed install at
# 2am. The URL list is GENERATED from fluxbilling.ipxe by src/menu-urls.sh -
# never hand-copied here - and cross-checked against the sign-boot-images.sh
# manifest, so a menu bump cannot leave either list stale.
#
# The `check` job only DETECTS. Signing stays on a machine you control -
# putting the code-signing key in Actions secrets would mean a GitHub
# compromise can mint a kernel every FluxBilling installer trusts, and iPXE
# has no usable revocation path without an OCSP responder to host. See
# docs/SIGNED-BOOT.md. The `bump` job auto-opens a PR when Ubuntu supersedes
# a pinned point release - it edits pins, it cannot sign.

name: upstream-watch

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write        # keepalive empty commit + bump branches
  issues: write
  pull-requests: write   # bump PRs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate the URL list from the menu itself
        run: |
          set -euo pipefail
          ./src/menu-urls.sh > urls.txt
          echo "$(grep -c '^ipxe ' urls.txt) iPXE URLs, $(grep -c '^bulk ' urls.txt) bulk URLs"

      - name: Cross-check the signing manifest against the menu
        id: sync
        run: |
          set -uo pipefail
          if ./src/menu-manifest-sync.sh > sync.txt 2>&1; then
            fail=0; : > sync.md
          else
            fail=1; sed 's/^/- /' sync.txt > sync.md
          fi
          cat sync.txt
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Probe iPXE-fetched URLs the way iPXE fetches them
        id: ipxe
        run: |
          set -uo pipefail
          fail=0; warn=0
          : > ipxe.md
          while read -r _ url; do
            # GitHub release assets ALWAYS 302 to a CDN host - that is how the
            # download endpoint works, it can never be "fixed" by a pin bump,
            # and iPXE follows it. Probe those with -L like a normal client;
            # only a non-2xx final status is news. (The sync step exempts the
            # same rows.) Everything else is probed the way iPXE fetches it.
            case "$url" in
              *github.com/*/releases/download/*)
                code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 --max-time 60 "$url")
                case "$code" in
                  200|206) ;;
                  *) echo "- **$code** $url (third-party GitHub release - the 22.04 boot images)" >> ipxe.md; fail=1 ;;
                esac
                continue ;;
            esac
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
                    --max-redirs 0 -r 0-0 --max-time 60 "$url" || echo "000 ")
            code=${out%% *}; loc=${out#* }
            case "$code" in
              200|206) ;;
              301|302|303|307|308)
                echo "- **REDIRECT $code** $url -> $loc (iPXE follows it, but scheme/host moved: the pin should be updated to the real target so the boot path has no redirect)" >> ipxe.md
                warn=1 ;;
              *) echo "- **$code** $url" >> ipxe.md; fail=1 ;;
            esac
          done < <(grep '^ipxe ' urls.txt)
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "warn=$warn" >> "$GITHUB_OUTPUT"

      - name: Probe the fallback hosts (diagnostic only)
        id: alt
        run: |
          set -uo pipefail
          : > alt.md
          # These legitimately 404 until the day the menu needs them, so this
          # step NEVER sets a failure flag. It exists so that when an issue is
          # filed for another reason, the operator can see at a glance whether
          # the recovery leg is serving.
          while read -r _ u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 --max-time 60 "$u")
            case "$code" in
              200|206) echo "- live \`$code\` $u" >> alt.md ;;
              *) echo "- not serving \`$code\` $u (normal until this host becomes the fallback)" >> alt.md ;;
            esac
          done < <(grep '^alt ' urls.txt)

      - name: Probe the bulk endpoints the installers fetch
        id: bulk
        run: |
          set -uo pipefail
          fail=0
          : > bulk.md
          # Installers carry a full CA bundle and follow redirects - probe
          # with matching semantics (-L).
          while read -r _ u; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -r 0-0 --max-time 120 "$u")
            case "$code" in
              200|206) ;;
              *) echo "- **$code** $u" >> bulk.md; fail=1 ;;
            esac
          done < <(grep '^bulk ' urls.txt)
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      - name: Detect drift from the last signed release
        id: boot
        run: |
          set -uo pipefail
          fail=0; drift=0
          : > report.md

          # SHA256SUMS from the most recent signed release, if one exists.
          tag=$(gh release list --limit 50 --json tagName \
                  --jq '[.[] | select(.tagName | startswith("boot-"))] | .[0].tagName' \
                2>/dev/null || true)
          if [ -n "${tag:-}" ] && [ "$tag" != "null" ]; then
            gh release download "$tag" -p SHA256SUMS -O signed.sums || : > signed.sums
            echo "Comparing against signed release \`$tag\`." >> report.md
          else
            : > signed.sums
            echo "No \`boot-*\` release yet - reachability covered above; drift check idle." >> report.md
          fi
          echo >> report.md

          ./src/sign-boot-images.sh --dry-run > manifest.txt

          while read -r name kind url; do
            # An "iso" row means the images are extracted from that ISO rather
            # than fetched loose (22.04.5 has no netboot tree). Its
            # reachability is already probed in the bulk step; hashing a
            # multi-GB ISO weekly proves nothing (its hash can never match the
            # extracted files in SHA256SUMS), so skip it here.
            [ "$kind" = iso ] && continue
            # Nothing signed yet - the download-and-hash pass has nothing to
            # compare against; reachability is covered by the probes above.
            [ -s signed.sums ] || continue
            if ! curl -fsSL --retry 3 --max-time 300 -o img.bin "$url"; then
              echo "- **UNREACHABLE** \`$name-$kind\` -> $url" >> report.md
              fail=1; continue
            fi
            now=$(sha256sum img.bin | cut -d' ' -f1)
            was=$(awk -v f="$name-$kind" '$2==f || $2=="*"f {print $1}' signed.sums | head -n1)
            if [ -n "$was" ] && [ "$was" != "$now" ]; then
              echo "- **CHANGED UPSTREAM** \`$name-$kind\` - signed \`${was:0:12}\`, now \`${now:0:12}\`" >> report.md
              drift=1
            fi
            rm -f img.bin
          done < manifest.txt

          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open an issue when something needs attention
        # failure() matters: menu-urls.sh and the sync step are DESIGNED to
        # exit non-zero (an unparseable menu is a hard failure), and a skipped
        # step's outputs are empty strings - so without it the watchdog's own
        # breakage would file nothing and look like a clean week.
        if: always() && (failure() || steps.sync.outputs.fail == '1' || steps.ipxe.outputs.fail == '1' || steps.ipxe.outputs.warn == '1' || steps.bulk.outputs.fail == '1' || steps.boot.outputs.fail == '1' || steps.boot.outputs.drift == '1')
        run: |
          set -uo pipefail
          {
            echo "Automated check of every endpoint the boot menu depends on."
            echo "_Last run: $(date -u +%Y-%m-%d\ %H:%M) UTC_"
            echo
            if [ ! -s urls.txt ] || [ ! -f ipxe.md ]; then
              echo "### The watchdog itself failed"
              echo "One of its own steps errored before the probes completed -"
              echo "check the workflow run log. The URL list is generated by"
              echo "\`src/menu-urls.sh\`, which exits non-zero by design when the"
              echo "menu cannot be parsed."
              echo
            fi
            if [ -s sync.md ]; then
              echo "### Menu and signing manifest out of sync"
              cat sync.md
              echo
            fi
            if [ -s ipxe.md ]; then
              echo "### iPXE-fetched URLs (kernel/initrd - probed with no redirect following)"
              cat ipxe.md
              echo
            fi
            if [ -s bulk.md ]; then
              echo "### Bulk endpoints not resolving (installer-side fetches)"
              cat bulk.md
              echo
            fi
            cat report.md
            echo
            if [ -s alt.md ]; then
              echo "<details><summary>Fallback hosts (diagnostic)</summary>"
              echo
              cat alt.md
              echo
              echo "</details>"
              echo
            fi
            echo "**What to do:**"
            echo "- A dead or redirected Ubuntu casper URL: bump the \`rel*\` var in"
            echo "  \`fluxbilling.ipxe\` (one edit drives kernel, initrd and ISO; the"
            echo "  \`bump\` job usually opens that PR for you)."
            echo "- A dead Debian suite: flip that suite's \`deb*_host\` var to"
            echo "  \`archive.debian.org\`. Fielded ISOs already retry it automatically."
            echo "- **CHANGED UPSTREAM** means a signed image no longer matches its"
            echo "  official mirror (Alma/Rocky/CentOS initrd and stage2 come from the"
            echo "  same compose). Re-run \`./src/sign-boot-images.sh\`, publish a fresh"
            echo "  \`boot-*\` release, and point \`fluxbilling.ipxe\` at it."
            echo "  See docs/SIGNED-BOOT.md."
          } > body.md
          # ONE tracking issue, not one per run. A watchdog on a weekly cron
          # would otherwise file a duplicate every Monday for as long as the
          # condition lasts (an upstream mirror can sit broken for months),
          # and the noise is what gets a watchdog muted. Reuse the open issue
          # by editing its body and adding a short comment instead.
          TITLE="upstream-watch: boot dependencies need attention"
          existing=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$existing" ] && [ ! -f ipxe.md ]; then
            # The watchdog itself broke before the probes ran, so body.md has
            # no findings in it. Comment - never REPLACE a body that may hold
            # a real, still-current outage report.
            gh issue comment "$existing" --body-file body.md
          elif [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            gh issue comment "$existing" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Details updated in the issue body."
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep the schedule alive
        # always(): this is the one step that must never be starved by an
        # earlier failure - a probe error is exactly when the repo is quiet
        # and the cron is closest to being auto-disabled.
        if: always()
        # GitHub silently disables cron workflows after 60 days without repo
        # activity - which is exactly the failure mode of a watchdog on a
        # stable repo. An empty commit once the repo has been quiet ~50 days
        # resets that clock.
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          [ "$age" -lt 50 ] && { echo "repo active ${age}d ago - nothing to do"; exit 0; }
          git config user.name "flux-watchdog"
          git config user.email "watchdog@users.noreply.github.com"
          git commit --allow-empty -m "ci: keepalive - scheduled workflows disable after 60 idle days"
          git push

  # PREREQUISITES for this job, both one-time repo settings:
  #   1. Settings -> Actions -> General -> "Allow GitHub Actions to create and
  #      approve pull requests" must be ON, or `gh pr create` fails outright.
  #   2. A PR opened with the default GITHUB_TOKEN does NOT trigger other
  #      workflows, so build-test will not run on these PRs. Either merge only
  #      after pushing an empty commit yourself, or set BUMP_TOKEN (a
  #      fine-grained PAT with contents+pull-requests write) as a repo secret -
  #      it is used below when present and makes the bump PR run CI normally.
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Open a PR when Ubuntu supersedes a pinned point release
        run: |
          set -euo pipefail
          # LTS series only - interim releases never get point releases.
          # Derived from the menu, not hardcoded: a release added to
          # fluxbilling.ipxe must not silently go untracked here.
          #   22.04 - netbootxyz kernel pin; bumping rel2204 would move the
          #           ISO while boot2204 keeps serving the old kernel.
          #   interim releases (a bare X.10 / non-LTS) never get point releases.
          skip_series='22.04 25.10'
          series_list=$(sed -n 's/^set rel\([0-9]\{4\}\) .*/\1/p' fluxbilling.ipxe \
            | sed -E 's/^([0-9]{2})([0-9]{2})$/\1.\2/')
          [ -n "$series_list" ] || { echo "::error::no rel* pins found in fluxbilling.ipxe"; exit 1; }
          for series in $series_list; do
            case " $skip_series " in *" $series "*) echo "skipping $series"; continue ;; esac
            var="rel$(echo "$series" | tr -d .)"
            have=$(sed -n "s/^set $var //p" fluxbilling.ipxe)
            [ -n "$have" ] || { echo "::error::no $var in fluxbilling.ipxe"; exit 1; }
            # The series directory lists EVERY point release it still serves
            # (24.04/ carries both 24.04.3 and 24.04.4 today), so take the
            # highest by version sort - `head -n1` returns whichever Canonical
            # happens to link first, which is page layout, not a version.
            latest=$(curl -fsSL --max-time 60 "https://releases.ubuntu.com/$series/" \
              | grep -oE "ubuntu-$series(\.[0-9]+)?-live-server-amd64\.iso" \
              | sed -E "s/^ubuntu-(.*)-live-server-amd64\.iso$/\1/" \
              | sort -V | tail -n1) || latest=""
            [ -n "$latest" ] || { echo "could not parse $series - skipping"; continue; }
            [ "$latest" = "$have" ] && { echo "$var: $have is current"; continue; }
            # Never propose going backwards: a transient page glitch must not
            # open a PR that downgrades a working pin.
            if [ "$(printf '%s\n%s\n' "$have" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
              echo "::warning::$series: parsed $latest is older than the pinned $have - ignoring"
              continue
            fi
            # The menu derives boot$var from rel$var, so a pin whose netboot
            # tree is missing would ship a kernel URL nobody checked. That
            # tree is published a little after the ISO, so this is a real
            # window, not a hypothetical one.
            skip=0
            for f in linux initrd; do
              # Assert the FINAL status. `-f` only fails on >=400, so without
              # -L a 301/302 exits 0 and the tree is reported published when
              # curl never saw what was behind the redirect.
              code=$(curl -sIL -o /dev/null -w '%{http_code}' --max-time 60 \
                       "http://releases.ubuntu.com/$latest/netboot/amd64/$f")
              case "$code" in
                200|206) ;;
                *) echo "::warning::$series $latest netboot/amd64/$f is $code - deferring the bump"
                   skip=1; break ;;
              esac
            done
            [ "$skip" = 1 ] && continue

            branch="bump-$var-$latest"
            # --state all: a bump PR the maintainer CLOSED on purpose ("we do
            # not want this bump") must not be reopened every Monday.
            # Capture separately: inside `if [ "$(gh ...)" ]` a gh failure is
            # invisible (command substitution in a test escapes set -e) and
            # the empty result reads as "a PR already exists", silently
            # skipping the bump forever.
            n=$(gh pr list --state all --head "$branch" --json number --jq length) || n=""
            case "$n" in
              ''|*[!0-9]*) echo "::error::gh pr list failed for $branch"; exit 1 ;;
            esac
            if [ "$n" != 0 ]; then
              echo "PR for $branch already exists (open, merged or closed)"; continue
            fi
            echo "$var: $have -> $latest"
            git checkout -B "$branch" "${GITHUB_REF_NAME:-main}"
            sed -i "s/^set $var .*/set $var $latest/" fluxbilling.ipxe
            # Keep the signing manifest in step (the sync check fails the
            # watchdog otherwise). Anchored to the URL path segment: a bare
            # global s/$have/$latest/ would also rewrite the NAME column when
            # a series gets its FIRST point release (26.04 -> 26.04.1 renames
            # ubuntu-26.04 to ubuntu-26.04.1), silently breaking SHA256SUMS
            # continuity and muting drift detection.
            esc=$(printf '%s' "$have" | sed 's/\./\\./g')
            sed -i "s|releases\.ubuntu\.com/$esc/|releases.ubuntu.com/$latest/|g" src/sign-boot-images.sh
            git config user.name "flux-watchdog"
            git config user.email "watchdog@users.noreply.github.com"
            git add fluxbilling.ipxe src/sign-boot-images.sh
            git commit -m "Bump Ubuntu $series: $have -> $latest"
            # -f: the branch is entirely machine-owned, and a previous run may
            # have pushed it and then died before opening the PR.
            git push -fu origin "$branch"
            gh pr create --title "Bump Ubuntu $series to $latest" --body "$(printf '%s\n' \
              "releases.ubuntu.com/$series/ now serves $latest; the pinned $have directory will be superseded (fielded ISOs fall back to old-releases automatically, new builds should pin the current release)." \
              "" \
              "- [ ] If a signed boot-* release exists: re-run ./src/sign-boot-images.sh and cut a fresh release" \
              "- [ ] Confirm build-test ran on this PR - a PR opened by GITHUB_TOKEN does not trigger it (see the prerequisites note in this workflow); push an empty commit if the checks are missing" \
              "" \
              "Opened automatically by upstream-watch.")"
            git checkout "${GITHUB_REF_NAME:-main}"
          done
        env:
          # BUMP_TOKEN when configured (its PRs trigger build-test), otherwise
          # the default token - see the prerequisites note above.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
