# Build the ISO and boot-test it on every push and PR.
#
# Catches the regression classes the local tests were built for - menu
# breakage, EMBED list drift, "Operation not supported" on embedded files,
# initrd injection loss, EFI El Torito breakage - without anyone having to
# remember to run them by hand. Both test scripts exit nonzero on any miss,
# so the job genuinely gates.
#
# The builder-image build (~10 min) runs on every job; it is the price of a
# clean-room build. GitHub Linux runners expose /dev/kvm, so the QEMU passes
# run KVM-accelerated (the scripts fall back to TCG elsewhere).

name: build-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the ISO (clean clone, exactly like a user would)
        run: ./build.sh

      - name: Consistency - URL list generates, and matches the signing manifest
        # menu-urls.sh exits non-zero when the menu cannot be fully parsed, and
        # the sync check catches a pin edited in one file but not the other -
        # both needs-no-network invariants, so they gate every push rather than
        # waiting for the weekly watchdog.
        run: |
          ./src/menu-urls.sh > /dev/null
          ./src/menu-manifest-sync.sh
          test -x src/fallback-test.sh || { echo '::error::src/fallback-test.sh missing'; exit 1; }

      - name: BIOS + UEFI boot smoke test
        run: |
          docker run --rm --platform linux/amd64 \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/w -e ISO=/w/FluxBilling-OS-Installer_v1.0.iso -e LOGDIR=/w/test-logs \
            fluxbilling-builder bash /w/src/qemu-test.sh

      - name: E2E initrd-injection + kernel-exec test
        run: |
          docker run --rm --platform linux/amd64 \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/w -e LOGDIR=/w/test-logs \
            fluxbilling-builder bash /w/src/e2e-test.sh

      - name: Self-heal fallback test (primary host dead)
        # The fallbacks cannot be reached while the real mirrors are up, which
        # is exactly when they matter least - so this boots ISOs whose primary
        # host is a dead address and asserts iPXE moves to the alternate.
        run: |
          docker run --rm --platform linux/amd64 \
            $( [ -e /dev/kvm ] && echo --device /dev/kvm ) \
            -v "$PWD":/w -e LOGDIR=/w/test-logs \
            fluxbilling-builder bash /w/src/fallback-test.sh

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: test-logs/
          if-no-files-found: ignore
