# Install every automated menu entry to completion, one runner per entry.
#
# build-test.yml proves the menu walks, an initrd unpacks and a fallback
# fires. It never lets an installer finish, so "answers accepted, box comes up
# configured with root SSH" was verified on Ubuntu 24.04 on real iDRAC and
# ASSUMED for the other 18 entries (README says as much). This closes that.
#
# MANUAL DISPATCH ONLY. Nineteen jobs of up to two hours that each pull 1-4 GB
# from a distro mirror is not a per-push cost, and hammering upstream mirrors
# on every PR would be rude. Run it before a release, or after a pin bump.
#
# GitHub's Linux runners expose /dev/kvm, so these are native-speed installs;
# src/install-matrix.sh refuses to run without it (TCG would take days).
# The ISO is built ONCE and shared, rather than paying the ~10 min builder
# image per job, nineteen times over.

name: install-matrix

on:
  workflow_dispatch:
    inputs:
      entries:
        description: 'Space-separated entry keys, or "all"'
        default: 'all'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the ISO
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: FluxBilling-OS-Installer_v1.0.iso
          retention-days: 1

  # The matrix is spelled out rather than generated: a workflow-level `matrix`
  # cannot be computed from a shell script without a second job, and the ORDER
  # here does not matter - install-matrix.sh cross-checks every key against
  # fluxbilling.ipxe's own menu and aborts if the two have drifted.
  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false      # one broken mirror must not hide the other 18 results
      max-parallel: 19
      matrix:
        entry: [ubu2604, ubu2510, ubu2404, ubu2204, ubu2004, ubu1804,
                deb13, deb12, deb11,
                al10, al9, al8, rk10, rk9, rk8, cs10, cs9,
                leap160, leap156]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: iso }

      - name: Skip entries not requested
        id: gate
        run: |
          want='${{ inputs.entries }}'
          if [ "$want" = all ] || [ -z "$want" ] || grep -qw '${{ matrix.entry }}' <<<"$want"; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Tooling + KVM
        if: steps.gate.outputs.run == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils sshpass
          # Runner images ship /dev/kvm owned by root:kvm; the job user is not
          # in that group by default, and qemu then falls back to... nothing,
          # because the harness hard-fails instead of silently using TCG.
          sudo chmod 0666 /dev/kvm
          kvm-ok 2>/dev/null || true
          test -w /dev/kvm

      - name: Install ${{ matrix.entry }}
        if: steps.gate.outputs.run == 'yes'
        run: |
          # /mnt is the runner's big scratch disk (~60 GB); the root fs has
          # barely 20 GB free and a qcow2 that grows past it kills the install
          # with an I/O error that looks like a product bug.
          sudo mkdir -p /mnt/flux && sudo chown "$USER" /mnt/flux
          ENTRIES='${{ matrix.entry }}' \
          ISO="$PWD/FluxBilling-OS-Installer_v1.0.iso" \
          WORK=/mnt/flux LOGDIR="$PWD/matrix-logs" \
          MEMBUDGET_MB=12288 \
            bash src/install-matrix.sh

      - name: Serial log
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.entry }}
          path: matrix-logs/
          retention-days: 14

  summary:
    needs: install
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'log-*', path: logs }
      - name: Table
        run: |
          {
            echo '| Entry | Result | Detail |'
            echo '|---|---|---|'
            for f in logs/log-*/*.result; do
              [ -e "$f" ] || continue
              read -r k st detail < "$f"
              echo "| $k | $st | ${detail:-} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
