# FluxBilling generic kickstart (AlmaLinux / Rocky Linux / CentOS Stream, 8/9/10).
# Embedded in the FluxBilling image and injected into the anaconda initrd as
# /flux-ks.cfg (inst.ks=file:///flux-ks.cfg; flux- prefix so nothing ever
# auto-probes it). Identity, static network and the repo base
# arrive on the kernel command line (fluxhost= fluxpass= fluxrepo= ip=) and are
# turned into kickstart commands by the %pre script below.

text
reboot
skipx
firstboot --disable
lang en_US.UTF-8
keyboard us
timezone Europe/Bucharest --utc

zerombr
clearpart --all --initlabel
autopart --type=plain --nohome

%include /tmp/flux.ks

%packages --ignoremissing
@core
openssh-server
curl
wget
%end

%pre --interpreter=/bin/sh
C=$(cat /proc/cmdline)
zget() {
    echo "$C" | tr ' ' '\n' | sed -n "s/^$1=//p" | head -n1
}
H=$(zget fluxhost); [ -n "$H" ] || H=fluxserver
R=$(zget fluxrepo)
IPCFG=$(zget ip)
IP=$(echo "$IPCFG" | cut -d: -f1)
GW=$(echo "$IPCFG" | cut -d: -f3)
NM=$(echo "$IPCFG" | cut -d: -f4)
{
    # NO password material in the kickstart. anaconda copies the fully
    # expanded kickstart - %include content and all - to /root/anaconda-ks.cfg
    # on the installed system, so anything written here is plaintext at rest
    # for the life of the box. Both accounts are created LOCKED and %post
    # sets the real credentials with chpasswd, which only ever writes a hash
    # into /etc/shadow.
    echo "rootpw --lock"
    echo "user --name=user --gecos='Default User' --lock"
    if [ -n "$IP" ] && [ -n "$GW" ] && [ -n "$NM" ]; then
        echo "network --device=bootif --bootproto=static --ip=$IP --netmask=$NM --gateway=$GW --nameserver=8.8.8.8,1.1.1.1 --hostname=$H --onboot=yes"
    else
        echo "network --bootproto=dhcp --hostname=$H"
    fi
    [ -n "$R" ] && echo "repo --name=appstream --baseurl=$R/AppStream/x86_64/os/"
} > /tmp/flux.ks
%end

%post
# Credentials are read here, not in %pre: /proc inside the %post chroot is the
# live one, so the value never has to be written into a file that survives.
# No fallback password - a missing fluxpass= leaves both accounts LOCKED
# rather than handing out a default that is published in a public repo.
P=$(tr ' ' '\n' < /proc/cmdline | sed -n 's/^fluxpass=//p' | head -n1)
if [ -n "$P" ]; then
    echo "root:$P" | chpasswd
    echo "user:$P" | chpasswd
else
    echo "FLUX: no fluxpass= on the kernel command line - root and user stay LOCKED." >&2
fi
unset P

sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
systemctl enable sshd

# anaconda copies its own logs into the installed system AFTER %post has run,
# and those logs record the full kernel command line - fluxpass= included.
# Nothing here can reach them yet, so scrub on first boot and self-destruct.
cat > /usr/local/sbin/flux-scrub <<'FLUXEOF'
#!/bin/sh
for f in /root/anaconda-ks.cfg /root/original-ks.cfg; do
    [ -e "$f" ] && { shred -u "$f" 2>/dev/null || rm -f "$f"; }
done
find /var/log/anaconda /var/log/installer -type f 2>/dev/null | while read -r f; do
    sed -i 's/fluxpass=[^[:space:]]*/fluxpass=<redacted>/g' "$f" 2>/dev/null || :
done
systemctl disable flux-scrub.service >/dev/null 2>&1 || :
rm -f /etc/systemd/system/flux-scrub.service /usr/local/sbin/flux-scrub
FLUXEOF
chmod 700 /usr/local/sbin/flux-scrub
cat > /etc/systemd/system/flux-scrub.service <<'FLUXEOF'
[Unit]
Description=FluxBilling: strip install-time credentials from installer logs
After=multi-user.target

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/flux-scrub

[Install]
WantedBy=multi-user.target
FLUXEOF
systemctl enable flux-scrub.service
%end
