# FluxBilling: installs the dracut half of the failure banner at boot -
# src/50-flux-fail.sh (injected as /flux-fail.sh) into dracut's emergency hook
# directory, and src/flux-giveup.sh (injected as /flux-giveup.sh), the time
# limit that gets an unreachable mirror to that banner, into its initqueue.
#
# Neither can be injected into those directories directly. iPXE unpacks the
# files it injects BEFORE the vendor initrd, so at that moment no part of
# dracut's tree exists yet, and the directory sits behind symlinks that differ
# by release: /lib/dracut/hooks is a real directory under usr/lib on EL8/EL9,
# and a symlink into var/lib/dracut/hooks on EL10 and Leap 16 (the imgargs
# block in fluxbilling.ipxe has the full story). So this file rides in instead
# as /etc/conf.d/flux-fail.conf, a real directory on every release: each dracut
# stage script sources /etc/conf.d/*.conf right after loading dracut-lib.sh -
# dracut-initqueue before its first pass, dracut-emergency before it runs the
# emergency hooks. Here $hookdir is dracut's own answer to where its hooks
# live, already resolved through whatever symlinks that release ships.
#
# SOURCED into every stage, never executed: a few lines of plain sh that set no
# variables and always succeed. A syntax error here would end every stage
# script that sources it - dracut's sh is bash in POSIX mode, where a broken
# `.` file is fatal - so src/console-ux-test.sh syntax-checks this file.
if [ -n "$hookdir" ] && [ -d "$hookdir/emergency" ] &&
	[ ! -e "$hookdir/emergency/50-flux-fail.sh" ]; then
	cp "${flux_fail_hook:-/flux-fail.sh}" "$hookdir/emergency/50-flux-fail.sh" 2>/dev/null
fi
if [ -n "$hookdir" ] && [ -d "$hookdir/initqueue" ] &&
	[ ! -e "$hookdir/initqueue/flux-giveup.sh" ]; then
	cp "${flux_giveup_job:-/flux-giveup.sh}" "$hookdir/initqueue/flux-giveup.sh" 2>/dev/null
fi
:
