# FluxBilling autoinstall trigger.
# Injected into the casper initrd as /conf/param.conf; casper sources this
# file after every casper-bottom script (see the "[ -e /conf/param.conf ]"
# lines in casper's ORDER), so no ORDER patching is needed and it works on
# any casper version. Runs the seed generator exactly once, as soon as the
# target root is mounted.
if [ ! -e /conf/.fluxdone ] && [ -d /root/etc ]; then
	touch /conf/.fluxdone
	sh /scripts/casper-bottom/99fluxseed
fi

# --- Failure banner ---------------------------------------------------------
# What a stopped casper install looked like before this existed: the last
# kernel message on screen, then nothing, forever. casper calls panic() from
# mountroot() - before any casper-bottom script runs - and initramfs-tools'
# panic() prints to stdout and opens its debug shell on the FIRST console in
# /proc/consoles, which is whichever console= came last on the cmdline. In
# AUTOMATED mode that is the serial line, so an operator on an iDRAC/iLO video
# console sees the failure nowhere at all (2026-09-15: a 24.04 install sat
# like that with a perfectly good error waiting on ttyS0).
#
# This file is sourced after EVERY hook in every ORDER file, including
# /scripts/init-top - which runs before mountroot - so a panic() defined here
# replaces the one from /scripts/functions for the rest of /init. It prints a
# labelled banner to every console the kernel has, then hands over to the same
# debug shell the stock panic() would have opened.
#
# It deliberately does NOT reboot, and deliberately ignores a panic= boot
# argument: a box that reboots on failure loops silently, and the operator
# loses both the reason and the shell. The server holds here with the error on
# screen until someone resets it - which is also how you get back to the boot
# menu, since iPXE is long gone by the time a kernel is running.
if [ -z "${flux_panic_wrapped:-}" ]; then
	flux_panic_wrapped=1

	# Every console the kernel actually has, plus the usual two as a
	# fallback, de-duplicated - /dev/console is deliberately not in the
	# list because it IS one of these devices and would double-print.
	# The two paths are variables so src/console-ux-test.sh can point them
	# at a temp directory and assert what actually gets written; in a real
	# initramfs they are the defaults. The writability test accepts a plain
	# file for the same reason - a console device is a character device, and
	# the test's stand-ins are files.
	flux_consoles() {
		{ awk '{print $1}' "${flux_proc_consoles:-/proc/consoles}" 2>/dev/null
		  echo tty0; echo ttyS0; } |
		while read -r d; do
			[ -n "$d" ] || continue
			case " ${seen:-} " in *" $d "*) continue ;; esac
			seen="${seen:-} $d"
			dev="${flux_devdir:-/dev}/$d"
			{ [ -c "$dev" ] || [ -f "$dev" ]; } && printf '%s\n' "$dev"
		done
	}

	panic() {
		flux_reason="$*"
		command -v chvt >/dev/null 2>&1 && chvt 1
		for flux_c in $(flux_consoles); do
			{
				printf '\n\033[1;31m'
				printf '======================================================\n'
				printf '  FluxBilling OS - INSTALL FAILED\n'
				printf '======================================================\033[0m\n'
				printf '  Reason: %s\n' "${flux_reason:-the installer stopped without a message}"
				printf '  Host:   %s\n' "${fluxhost:-unset}"
				printf '  Nothing has been written to the target disk.\n'
				printf '\n'
				printf '  The server is HELD here on purpose - it will not\n'
				printf '  reboot on its own. Reset it (or Ctrl-Alt-Del) to\n'
				printf '  return to the FluxBilling boot menu and pick an\n'
				printf '  entry again.\n'
				printf '======================================================\n\n'
			} > "$flux_c" 2>/dev/null
		done

		run_scripts /scripts/panic

		# Same debug shell the stock panic() opens, on the same console it
		# would have chosen - the banner above is what makes the failure
		# visible everywhere else.
		if command -v setsid >/dev/null 2>&1; then
			unset IFS
			read -r flux_con flux_rest < /proc/consoles
			[ "${flux_con}" = "tty0" ] && flux_con="tty1"
			REASON="$*" PS1='(flux-failed) ' setsid sh -c "exec sh -i <>/dev/${flux_con} 1>&0 2>&1"
		else
			REASON="$*" PS1='(flux-failed) ' sh -i </dev/console >/dev/console 2>&1
		fi
	}
fi

# --- Download progress, on every console ------------------------------------
# casper fetches the install ISO with wget, and wget draws its progress bar on
# stdout - one console. A 3-4 GB image over a slow link is then 40+ minutes of
# apparently frozen screen for whoever is watching the OTHER one, which is how
# a healthy install gets power-cycled by hand. Measured on a live box while
# writing this: 0.8 MB/s, 41 minutes remaining, and nothing on the video
# console but the last kernel message.
#
# The watcher below mirrors the same facts to the consoles wget is NOT drawing
# on. It only reads /proc and runs ls, never touches the download, and exits as
# soon as wget is gone - so it cannot be the process that holds the old root
# open when casper switch_roots.
flux_progress_start() {
	[ -z "${flux_progress_on:-}" ] || return 0
	flux_progress_on=1
	(
		cd /
		proc=${flux_procdir:-/proc}
		prim=$(awk 'NR==1{print $1}' "${flux_proc_consoles:-/proc/consoles}" 2>/dev/null)
		mirror=""
		for c in $(flux_consoles); do
			[ "$c" = "${flux_devdir:-/dev}/$prim" ] || mirror="$mirror $c"
		done
		# Only one console: wget is already drawing on it.
		[ -n "$mirror" ] || exit 0
		seen=0; waited=0; last_b=0; last_t=0; name=""
		while :; do
			# A mounted root means the fetch finished long ago.
			[ -d /root/etc ] && break
			pid=""
			for d in "$proc"/[0-9]*; do
				grep -qa "^wget" "$d/cmdline" 2>/dev/null && { pid=$d; break; }
			done
			if [ -z "$pid" ]; then
				[ "$seen" = 1 ] && break
				waited=$((waited + 1))
				[ "$waited" -gt 720 ] && break
				sleep 5
				continue
			fi
			seen=1
			# The -O target, not the URL: both end in .iso, only one is a path.
			f=$(tr '\0' '\n' < "$pid/cmdline" 2>/dev/null | grep -v '^http' | grep '\.iso$' | tail -1)
			[ -n "$f" ] || f=$(ls /*.iso 2>/dev/null | head -1)
			b=$(ls -l "$f" 2>/dev/null | awk '{print $5}')
			t=$(cut -d. -f1 "$proc/uptime" 2>/dev/null)
			case "$b|$t" in *[!0-9\|]*|"|"|"|"*|*"|") sleep 5; continue ;; esac
			name=$(basename "$f")
			rate=""
			dt=$((t - last_t)); db=$((b - last_b))
			if [ "$last_t" -gt 0 ] && [ "$dt" -gt 0 ] && [ "$db" -ge 0 ]; then
				r10=$(((db * 10) / (dt * 1048576)))
				rate=" at $((r10 / 10)).$((r10 % 10)) MB/s"
			fi
			last_b=$b; last_t=$t
			for c in $mirror; do
				printf 'FluxBilling: downloading %s - %s MB%s, %sm%ss elapsed\n' \
					"$name" "$((b / 1048576))" "$rate" "$((t / 60))" "$((t % 60))" \
					> "$c" 2>/dev/null
			done
			sleep 5
		done
		[ "$seen" = 1 ] || exit 0
		for c in $mirror; do
			printf 'FluxBilling: %s downloaded (%s MB) - mounting it and starting the installer\n' \
				"${name:-image}" "$((last_b / 1048576))" > "$c" 2>/dev/null
		done
	) &
}

# Guarded inside, so sourcing this file after every hook starts exactly one
# watcher - and it waits for wget rather than assuming it has already started.
flux_progress_start 2>/dev/null

# --- Fetch the ISO from whichever source is fast ----------------------------
# /conf/flux-mirror-pick redefines casper's do_urlmount to race mirrors against
# releases.ubuntu.com and use the winner, with the origin as the fallback. It
# is sourced (not run) because it has to replace a function in casper's own
# shell, and only once ${URL} exists - parse_cmdline sets that inside
# mountroot, so the early sourcings of this file simply skip it.
if [ -n "${URL:-}" ] && [ -z "${flux_mirror_sourced:-}" ] && [ -r /conf/flux-mirror-pick ]; then
	flux_mirror_sourced=1
	. /conf/flux-mirror-pick
fi
